name: iPhone fast-delivery check

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min (GitHub may delay runs by a few minutes)
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'Send a test notification only'
        type: boolean
        default: false

concurrency:
  group: iphone-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_ON_PICKUP: ${{ vars.ALERT_ON_PICKUP || 'false' }}
          TEST_NOTIFY: ${{ inputs.test_notify || 'false' }}
